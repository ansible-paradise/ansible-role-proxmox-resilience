---
- name: Validate proxmox_resilience boolean variables
  ansible.builtin.assert:
    that:
      - proxmox_resilience_enabled is boolean
    fail_msg: "Boolean validation failed for proxmox_resilience variables"
    quiet: true

- name: Validate proxmox_resilience numeric variables
  ansible.builtin.assert:
    that:
      - proxmox_resilience_vm_min_free_kbytes is number
      - proxmox_resilience_vm_min_free_kbytes | int > 0
      - proxmox_resilience_kernel_panic is number
      - proxmox_resilience_kernel_hung_task_panic is number
      - proxmox_resilience_kernel_hung_task_timeout_secs is number
      - proxmox_resilience_vm_panic_on_oom is number
      - proxmox_resilience_kernel_nmi_watchdog is number
      - proxmox_resilience_vm_swappiness is number
      - proxmox_resilience_kernel_split_lock_mitigate is number
      - proxmox_resilience_zswap_max_pool_percent is number
    fail_msg: "Numeric validation failed for proxmox_resilience variables"
    quiet: true

- name: Validate proxmox_resilience string variables
  ansible.builtin.assert:
    that:
      - proxmox_resilience_zswap_compressor is string
    fail_msg: "String validation failed for proxmox_resilience variables"
    quiet: true
